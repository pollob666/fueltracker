org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=true
org.gradle.parallel=true

# Built-in Kotlin enabled for AGP 9.0+.
# Note: KGP deprecation warnings for home_widget and workmanager_android are known
# static-regex false positives (flutter/flutter#189770). Both plugins support AGP 9+
# at runtime. Do not flip android.builtInKotlin to false.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Disable R8 full mode to prevent overly aggressive stripping of reflection-instantiated classes (WorkManager, Room, Gson)
android.enableR8.fullMode=false
