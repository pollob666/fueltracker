allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.0"
            force "org.jetbrains.kotlin:kotlin-reflect:2.4.0"
        }
    }
}

rootProject.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir("../build"))
subprojects {
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
