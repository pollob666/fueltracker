import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// This now looks for key.properties in the same directory (android/app).
def keystorePropertiesFile = file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.pollob666.fueltracker"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"


    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // This will look for the keystore file in the android/app directory.
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.pollob666.fueltracker"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // This ensures signing is only attempted if the properties file exists.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Sign debug builds with release key when key.properties exists
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

def getBuildTimestamp() {
    return LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyyMMdd-HHmm"))
}

android.applicationVariants.configureEach { variant ->
    def variantName = variant.name
    def capVariantName = variantName.capitalize()

    // Copy custom-named APK alongside standard flutter-apk output
    variant.assembleProvider.configure { assembleTask ->
        assembleTask.doLast {
            def timestamp = getBuildTimestamp()
            def customBaseName = "fueltracker-v${flutter.versionName}-${flutter.versionCode}-${timestamp}"
            def customApkName = "${customBaseName}.apk"

            def apkDir = variant.packageApplicationProvider.get().outputDirectory.get().asFile
            def flutterApkDir = project.layout.buildDirectory.dir("outputs/flutter-apk").get().asFile

            flutterApkDir.mkdirs()

            apkDir.listFiles()?.findAll { it.name.endsWith(".apk") && !it.name.startsWith("fueltracker-") }?.each { apkFile ->
                project.copy {
                    from(apkFile)
                    into(apkDir)
                    rename { customApkName }
                }
                project.copy {
                    from(apkFile)
                    into(flutterApkDir)
                    rename { customApkName }
                }
            }
        }
    }

    // Copy custom-named AAB alongside standard bundle output
    tasks.matching { it.name == "bundle${capVariantName}" }.configureEach { bundleTask ->
        bundleTask.doLast {
            def timestamp = getBuildTimestamp()
            def customBaseName = "fueltracker-v${flutter.versionName}-${flutter.versionCode}-${timestamp}"
            def customAabName = "${customBaseName}.aab"

            def bundleDir = project.layout.buildDirectory.dir("outputs/bundle/${variantName}").get().asFile
            if (bundleDir.exists()) {
                bundleDir.listFiles()?.findAll { it.name.endsWith(".aab") && !it.name.startsWith("fueltracker-") }?.each { aabFile ->
                    project.copy {
                        from(aabFile)
                        into(bundleDir)
                        rename { customAabName }
                    }
                }
            }
        }
    }
}
