# Build and publish APKs only when pubspec.yaml version changes on master.
name: Build and Release APK

on:
  push:
    branches:
      - master
    paths:
      - pubspec.yaml

# Queue release runs so tags and release uploads cannot race.
concurrency:
  group: fueltracker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-change:
    if: github.event.head_commit.author.email == 'pollob666@gmail.com' || github.event.head_commit.committer.email == 'pollob666@gmail.com'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify signed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_DATA=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }})
          VERIFIED=$(echo "$COMMIT_DATA" | jq -r '.commit.verification.verified')
          REASON=$(echo "$COMMIT_DATA" | jq -r '.commit.verification.reason')
          AUTHOR_EMAIL=$(echo "$COMMIT_DATA" | jq -r '.commit.author.email' | tr '[:upper:]' '[:lower:]')
          COMMITTER_EMAIL=$(echo "$COMMIT_DATA" | jq -r '.commit.committer.email' | tr '[:upper:]' '[:lower:]')
          if [[ "$VERIFIED" != "true" || "$REASON" != "valid" ]]; then
            echo "::error::Commit signature is invalid or unverified (verified=$VERIFIED, reason=$REASON)."
            exit 1
          fi
          if [[ "$AUTHOR_EMAIL" != "pollob666@gmail.com" && "$COMMITTER_EMAIL" != "pollob666@gmail.com" ]]; then
            echo "::error::Commit is not authored or committed by pollob666@gmail.com."
            exit 1
          fi

      - name: Detect version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)
          if [[ ! "$VERSION" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\+((0|[1-9][0-9]*))$ ]]; then
            echo "::error::Expected pubspec version in MAJOR.MINOR.PATCH+BUILD format; got '$VERSION'."
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          MAJOR="${BASH_REMATCH[2]}"
          MINOR="${BASH_REMATCH[3]}"
          PATCH="${BASH_REMATCH[4]}"
          BUILD_NUMBER="${BASH_REMATCH[5]}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            PREVIOUS_VERSION=""
          else
            PREVIOUS_VERSION=$(git show "$BEFORE_SHA:pubspec.yaml" 2>/dev/null | sed -n 's/^version: *//p' | head -n 1 || true)
          fi
          if [[ "$VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "Version unchanged ($VERSION); skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$PREVIOUS_VERSION" ]]; then
              if [[ ! "$PREVIOUS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Previous pubspec version '$PREVIOUS_VERSION' is invalid."
                exit 1
              fi
              PREVIOUS_MAJOR="${BASH_REMATCH[1]}"
              PREVIOUS_MINOR="${BASH_REMATCH[2]}"
              PREVIOUS_PATCH="${BASH_REMATCH[3]}"
              PREVIOUS_BUILD="${BASH_REMATCH[4]}"
              VERSION_INCREASED=false
              if (( MAJOR > PREVIOUS_MAJOR )); then
                VERSION_INCREASED=true
              elif (( MAJOR == PREVIOUS_MAJOR && MINOR > PREVIOUS_MINOR )); then
                VERSION_INCREASED=true
              elif (( MAJOR == PREVIOUS_MAJOR && MINOR == PREVIOUS_MINOR && PATCH > PREVIOUS_PATCH )); then
                VERSION_INCREASED=true
              elif (( MAJOR == PREVIOUS_MAJOR && MINOR == PREVIOUS_MINOR && PATCH == PREVIOUS_PATCH && BUILD_NUMBER > PREVIOUS_BUILD )); then
                VERSION_INCREASED=true
              fi
              if [[ "$VERSION_INCREASED" != true ]]; then
                echo "::error::Version must increase from '$PREVIOUS_VERSION' to '$VERSION'."
                exit 1
              fi
            fi
            echo "Version changed: '${PREVIOUS_VERSION:-<none>}' -> '$VERSION'."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode Keystore and Create Properties File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          echo "storeFile=release.jks" > android/app/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/app/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/app/key.properties
          echo "storePassword=$STORE_PASSWORD" >> android/app/key.properties

      - name: Build signed release APK
        run: flutter build apk --release --build-name '${{ needs.detect-version-change.outputs.version_name }}' --build-number '${{ needs.detect-version-change.outputs.build_number }}'

      - name: Build signed debug APK
        run: flutter build apk --debug --build-name '${{ needs.detect-version-change.outputs.version_name }}' --build-number '${{ needs.detect-version-change.outputs.build_number }}'

      - name: Stage APKs
        run: |
          mkdir -p staged-apks
          cp build/app/outputs/flutter-apk/fueltracker-v*-release.apk staged-apks/
          cp build/app/outputs/flutter-apk/fueltracker-v*-debug.apk staged-apks/
          ls -la staged-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apk-artifacts
          path: staged-apks/*.apk

  create-release:
    needs: [detect-version-change, build]
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reject existing release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.detect-version-change.outputs.version }}
        run: |
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Git tag '$RELEASE_TAG' already exists; increment pubspec.yaml version before releasing."
            exit 1
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v7
        with:
          name: apk-artifacts
          path: artifacts/apk

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          name: "Release ${{ needs.detect-version-change.outputs.version_name }}"
          body: |
            Automated release for version ${{ needs.detect-version-change.outputs.version }}.
            - Release APK (signed with release key)
            - Debug APK (signed with release key)
          files: artifacts/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
