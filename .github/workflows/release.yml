# GitHub Actions workflow for building and releasing Flutter APKs.
#
# This workflow is triggered on every push to the 'master' branch.
# It verifies that the commit is cryptographically signed and authored/committed
# by 'pollob666@gmail.com'. It automatically increments the version number based
# on conventional commit messages, builds a signed release APK, and creates a
# new GitHub Release with the file.
# The version bump is only committed if the build and release are successful.
#
name: Build and Release APK

on:
  push:
    branches:
      - master

jobs:
  calculate-version:
    if: "!contains(github.event.head_commit.message, 'ci: Bump version') && (github.event.head_commit.author.email == 'pollob666@gmail.com' || github.event.head_commit.committer.email == 'pollob666@gmail.com')"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.version-increment.outputs.new_version }}
      new_version_name: ${{ steps.version-increment.outputs.new_version_name }}
      new_build_number: ${{ steps.version-increment.outputs.new_build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetches all history for version bumping.

      - name: Verify Signed Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_DATA=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }})
          VERIFIED=$(echo "$COMMIT_DATA" | jq -r '.commit.verification.verified')
          REASON=$(echo "$COMMIT_DATA" | jq -r '.commit.verification.reason')
          AUTHOR_EMAIL=$(echo "$COMMIT_DATA" | jq -r '.commit.author.email' | tr '[:upper:]' '[:lower:]')
          COMMITTER_EMAIL=$(echo "$COMMIT_DATA" | jq -r '.commit.committer.email' | tr '[:upper:]' '[:lower:]')

          echo "Commit: ${{ github.sha }}"
          echo "Signature Status: verified=$VERIFIED, reason=$REASON"
          echo "Author: $AUTHOR_EMAIL, Committer: $COMMITTER_EMAIL"

          if [[ "$VERIFIED" != "true" || "$REASON" != "valid" ]]; then
            echo "::error::Commit ${{ github.sha }} signature is invalid or unverified (status: $VERIFIED, reason: $REASON)."
            exit 1
          fi

          if [[ "$AUTHOR_EMAIL" != "pollob666@gmail.com" && "$COMMITTER_EMAIL" != "pollob666@gmail.com" ]]; then
            echo "::error::Commit ${{ github.sha }} is not authored or committed by pollob666@gmail.com."
            exit 1
          fi

          echo "Cryptographic signature and identity verified for pollob666@gmail.com."

      - name: Determine Version Increment
        id: version-increment-type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"majorUpdate"* || "$COMMIT_MSG" == *"BREAKING CHANGE"* || "$COMMIT_MSG" == *"refactor:"* || "$COMMIT_MSG" == *"refactor("* ]]; then
            echo "increment=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"feat:"* || "$COMMIT_MSG" == *"feat("* ]]; then
            echo "increment=minor" >> $GITHUB_OUTPUT
          else
            echo "increment=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate New Version
        id: version-increment
        run: |
          # FIX: Added ^ to match only the version at the start of the line
          CURRENT_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          VERSION_PART=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_PART=$(echo $CURRENT_VERSION | cut -d'+' -f2)
          MAJOR=$(echo $VERSION_PART | cut -d'.' -f1)
          MINOR=$(echo $VERSION_PART | cut -d'.' -f2)
          PATCH=$(echo $VERSION_PART | cut -d'.' -f3)
          BUMP_TYPE=${{ steps.version-increment-type.outputs.increment }}
          if [[ "$BUMP_TYPE" == "major" ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUILD_PART=1
          elif [[ "$BUMP_TYPE" == "minor" ]]; then
            MINOR=$((MINOR + 1)); PATCH=0; BUILD_PART=1
          else # patch
            PATCH=$((PATCH + 1)); BUILD_PART=$((BUILD_PART + 1))
          fi
          NEW_VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          NEW_BUILD_NUMBER="$BUILD_PART"
          NEW_VERSION="$NEW_VERSION_NAME+$NEW_BUILD_NUMBER"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version_name=${NEW_VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "new_build_number=${NEW_BUILD_NUMBER}" >> $GITHUB_OUTPUT

  build:
    needs: calculate-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update pubspec.yaml for build
        run: |
          # FIX: Added ^ to ensure we only replace the root version key
          sed -i "s/^version: .*/version: ${{ needs.calculate-version.outputs.new_version }}/" pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode Keystore and Create Properties File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          echo "storeFile=release.jks" > android/app/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/app/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/app/key.properties
          echo "storePassword=$STORE_PASSWORD" >> android/app/key.properties

      - name: Build signed release APK
        run: |
          flutter build apk --release \
            --build-name ${{ needs.calculate-version.outputs.new_version_name }} \
            --build-number ${{ needs.calculate-version.outputs.new_build_number }}

      - name: Build signed debug APK
        run: |
          flutter build apk --debug \
            --build-name ${{ needs.calculate-version.outputs.new_version_name }} \
            --build-number ${{ needs.calculate-version.outputs.new_build_number }}

      - name: Locate and stage APK artifacts
        id: stage_apks
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          mkdir -p staged-apks

          # Locate Release APK
          RELEASE_APK=$(find build/app/outputs/flutter-apk -name "fueltracker-v*-release.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" staged-apks/
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "staged-apks/fueltracker-v${{ needs.calculate-version.outputs.new_version_name }}-${{ needs.calculate-version.outputs.new_build_number }}-${TIMESTAMP}-release.apk"
          fi

          # Locate Debug APK
          DEBUG_APK=$(find build/app/outputs/flutter-apk -name "fueltracker-v*-debug.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" staged-apks/
          elif [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk "staged-apks/fueltracker-v${{ needs.calculate-version.outputs.new_version_name }}-${{ needs.calculate-version.outputs.new_build_number }}-${TIMESTAMP}-debug.apk"
          fi

          echo "Staged APKs:"
          ls -la staged-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: staged-apks/*.apk

  create-release:
    needs: [build, calculate-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts/apk

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.calculate-version.outputs.new_version }}
          name: "Release ${{ needs.calculate-version.outputs.new_version_name }}"
          body: |
            Automated release for version ${{ needs.calculate-version.outputs.new_version_name }}.
            - Release APK (signed with release key)
            - Debug APK (signed with release key)
          files: |
            artifacts/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-and-push-version-bump:
    needs: [calculate-version, create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # FIX: Added ^ to ensure we only replace the root version key
          sed -i "s/^version: .*/version: ${{ needs.calculate-version.outputs.new_version }}/" pubspec.yaml
          git add pubspec.yaml
          git commit -m "ci: Bump version to ${{ needs.calculate-version.outputs.new_version }}"
          git pull --rebase origin master
          git push origin master
