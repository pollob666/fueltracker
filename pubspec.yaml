name: fuel_tracker
description: "Fuel Consumption Tracker by https://github.com/pollob666"

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

# The following defines the version and build number for your application.
version: 3.7.4+7

# The following defines the environment constraints for your application.
environment:
  sdk: '>=3.13.0 <4.0.0'

# Application dependencies
dependencies:
  # Core Flutter packages
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^2.0.0 # Kept for potential iOS-style icons.
  dynamic_color: ^1.9.0 # For dynamic theming based on user's wallpaper (Android 12+).
  fl_chart: ^0.70.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Data & Storage
  csv: ^8.0.0
  crypto: ^3.0.6
  file_picker: ^13.3.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5

  # Internationalization
  intl: ^0.20.2

  # Geolocation & Mapping
  geolocator: ^13.0.2

  # Networking & Versioning
  http: ^1.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  version: ^3.0.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

  # Reporting & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Camera, Attachments & OCR Vision
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^1.0.0

  # Encrypted Backups & Cloud Sync
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # Launcher Quick Actions & Home Screen Widgets
  quick_actions: ^1.1.0
  home_widget: ^0.10.0

  # Background Automation
  workmanager: ^0.10.10

  # Material 3 Animations & Shared Axis Transitions
  animations: ^2.0.11

  # In-App Purchase & Monetization
  in_app_purchase: ^3.2.0


# Development-only dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # Generates launcher icons for Android and iOS.
  sqflite_common_ffi: ^2.4.5

# Flutter-specific configurations
flutter:
  generate: true # Enables generation of AppLocalizations using `flutter gen-l10n`.
  uses-material-design: true

  assets:
    - assets/fuelTracker.png
    - assets/dash.png

# Launcher icon configuration (uses the `flutter_launcher_icons` package).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
  image_path: "assets/fuelTracker.png"
